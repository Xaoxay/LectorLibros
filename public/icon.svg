<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Subtle glow -->
  <circle cx="256" cy="220" r="140" fill="#f59e0b" opacity="0.12" filter="blur(40px)"/>

  <!-- Open Book Graphic -->
  <g filter="url(#shadow)" transform="translate(0, 10)">
    <!-- Left Page -->
    <path d="M256 360 C210 325 150 325 90 335 L90 155 C150 145 210 145 256 180 Z" fill="url(#pageGrad)"/>
    <!-- Right Page -->
    <path d="M256 360 C302 325 362 325 422 335 L422 155 C362 145 302 145 256 180 Z" fill="#f1f5f9"/>
    
    <!-- Spine Center -->
    <path d="M253 180 L253 360 C254 361 258 361 259 360 L259 180 Z" fill="#cbd5e1"/>

    <!-- Bookmark Ribbon -->
    <path d="M246 160 L246 270 L256 255 L266 270 L266 160 Z" fill="url(#bookGrad)"/>

    <!-- Text Lines Left Page -->
    <rect x="120" y="195" width="95" height="10" rx="5" fill="#94a3b8" opacity="0.6"/>
    <rect x="120" y="225" width="105" height="10" rx="5" fill="#94a3b8" opacity="0.6"/>
    <rect x="120" y="255" width="80" height="10" rx="5" fill="#94a3b8" opacity="0.6"/>
    <rect x="120" y="285" width="100" height="10" rx="5" fill="#94a3b8" opacity="0.6"/>

    <!-- Text Lines Right Page -->
    <rect x="295" y="195" width="95" height="10" rx="5" fill="#94a3b8" opacity="0.6"/>
    <rect x="295" y="225" width="75" height="10" rx="5" fill="#94a3b8" opacity="0.6"/>
    <rect x="295" y="255" width="105" height="10" rx="5" fill="#94a3b8" opacity="0.6"/>
    <rect x="295" y="285" width="90" height="10" rx="5" fill="#94a3b8" opacity="0.6"/>
  </g>
</svg>

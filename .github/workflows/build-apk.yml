name: Generar APK de Android (Lector Libros v2.5)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Configurar Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes de Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "platforms;android-33" "build-tools;34.0.0" "ndk;23.1.7779620" "cmake;3.22.1"

      - name: Instalar dependencias del proyecto
        run: npm ci --legacy-peer-deps

      - name: Validar lector y EPUB
        run: npm test

      - name: Permisos de ejecucion para Gradle
        run: chmod +x ./android/gradlew

      - name: Compilar APK Android (Release)
        working-directory: ./android
        run: |
          set +e
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee gradle_build.log
          GRADLE_EXIT=${PIPESTATUS[0]}
          if [ $GRADLE_EXIT -ne 0 ]; then
            echo "### ❌ Error en compilación de Gradle (Código: $GRADLE_EXIT)" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 100 gradle_build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $GRADLE_EXIT
          fi

      - name: Recolectar archivos APK generados
        run: |
          mkdir -p apk_output
          find android/app/build/outputs/apk/ -name "*.apk" -type f -exec cp {} apk_output/ \;
          
          if [ -f apk_output/app-release.apk ]; then
            cp apk_output/app-release.apk apk_output/LectorLibros-v2.5.apk
            cp apk_output/app-release.apk apk_output/LectorLibros.apk
          elif [ -f apk_output/app-debug.apk ]; then
            cp apk_output/app-debug.apk apk_output/LectorLibros-v2.5.apk
            cp apk_output/app-debug.apk apk_output/LectorLibros.apk
          fi
          
          echo "=== Archivos APK generados ==="
          ls -lh apk_output/

      - name: Subir APK como artefacto de descarga
        uses: actions/upload-artifact@v4
        with:
          name: LectorLibros-v2.5-APK
          path: apk_output/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar Release en GitHub con APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.5.${{ github.run_number }}
          name: Lector Libros v2.5.${{ github.run_number }}
          body: |
            ### 📱 Lector Libros v2.5 para Android
            ¡Tu aplicación ya está lista para instalar!
            
            Descarga directamente el archivo **`LectorLibros-v2.5.apk`** que aparece abajo en los archivos adjuntos (Assets) e instálalo en tu celular Android.
          files: apk_output/*.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

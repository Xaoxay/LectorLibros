name: Generar APK de Android (lectorlibro v2.7.0)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master, codex/stability-fixes ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translation-service:
    name: Validar servicio de traducción
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Instalar servicio
        working-directory: server
        run: npm ci
      - name: Probar cola, proveedor y extracción PDF
        working-directory: server
        run: npm test

  build:
    name: Compilar APK Android
    needs: translation-service
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Configurar Java 17 (JDK)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar componentes de Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;23.1.7779620" "cmake;3.22.1"

      - name: Instalar dependencias del proyecto
        run: npm ci --legacy-peer-deps

      - name: Validar lector y EPUB
        run: npm test

      - name: Permisos de ejecucion para Gradle
        run: chmod +x ./android/gradlew

      - name: Compilar APK Android (Release)
        working-directory: ./android
        run: |
          set +e
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee gradle_build.log
          GRADLE_EXIT=${PIPESTATUS[0]}
          if [ $GRADLE_EXIT -ne 0 ]; then
            echo "### ❌ Error en compilación de Gradle (Código: $GRADLE_EXIT)" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 100 gradle_build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $GRADLE_EXIT
          fi

      - name: Recolectar archivos APK generados
        run: |
          mkdir -p apk_output
          find android/app/build/outputs/apk/ -name "*.apk" -type f -exec cp {} apk_output/ \;
          
          if [ -f apk_output/app-release.apk ]; then
            cp apk_output/app-release.apk apk_output/lectorlibro.apk
            cp apk_output/app-release.apk apk_output/lectorlibro-v2.7.0.apk
            cp apk_output/app-release.apk apk_output/LectorLibros.apk
          elif [ -f apk_output/app-debug.apk ]; then
            cp apk_output/app-debug.apk apk_output/lectorlibro.apk
            cp apk_output/app-debug.apk apk_output/lectorlibro-v2.7.0.apk
            cp apk_output/app-debug.apk apk_output/LectorLibros.apk
          fi
          
          echo "=== Archivos APK generados ==="
          ls -lh apk_output/

      - name: Subir APK como artefacto de descarga
        uses: actions/upload-artifact@v4
        with:
          name: lectorlibro-v2.7.0-APK
          path: apk_output/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar Release en GitHub con APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.7.0-build.${{ github.run_number }}
          name: lectorlibro v2.7.0 (build ${{ github.run_number }})
          body: |
            ### 📱 lectorlibro v2.7.0 para Android
            ¡Tu aplicación **lectorlibro** ya está lista para instalar!
            
            Descarga directamente el archivo **`lectorlibro.apk`** que aparece abajo en los archivos adjuntos (Assets) e instálalo en tu celular Android.
            
            #### Novedades:
            - Nuevo diseño cálido de biblioteca, con crema, tinta y acentos terracota.
            - Traducción completa de chino, japonés, coreano e inglés a español latino.
            - Traducción y revisión por fragmentos, progreso, pausa y reanudación.
            - Copia en español independiente del libro original.
            - El traductor requiere un servicio conectado y una API configurada.

          files: apk_output/*.apk
          draft: false
          prerelease: false

          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Generar APK de Android (Lector Libros)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configurar Java 21 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes de Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "platforms;android-35" "build-tools;36.0.0" "build-tools;35.0.0" || true

      - name: Permisos ejecutables para Gradle
        run: chmod +x ./android/gradlew

      - name: Instalar dependencias
        run: npm install

      - name: Compilar aplicacion web
        run: npm run build

      - name: Sincronizar proyecto con Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          cp capacitor.config.json android/app/src/main/assets/capacitor.config.json || true
          npx cap sync android || echo "::warning::Sync con capacitor finalizo con advertencias"

      - name: Compilar APK Debug con Gradle
        working-directory: ./android
        run: |
          set -o pipefail
          touch ../gradle_build.log
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle_build.log

      - name: Mostrar registro en caso de fallo
        if: failure()
        run: |
          echo "==================== ULTIMAS LINEAS DE GRADLE ===================="
          tail -n 200 gradle_build.log || tail -n 200 android/gradle_build.log || true
          echo "================================================================="
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B debug-logs
          cp gradle_build.log android_build_error.log || cp android/gradle_build.log android_build_error.log || true
          git add android_build_error.log
          git commit -m "ci: dump gradle error log" || true
          git push origin debug-logs --force || true

      - name: Subir log de error si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-error-log
          path: |
            gradle_build.log
            android/gradle_build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Recolectar archivos APK generados
        run: |
          mkdir -p apk_output
          find android/ -name "*.apk" -type f -exec cp {} apk_output/ \;
          if [ -f apk_output/app-debug.apk ]; then
            cp apk_output/app-debug.apk apk_output/LectorLibros.apk
          fi
          echo "Archivos APK listos:"
          ls -lh apk_output/

      - name: Subir APK como artefacto de descarga
        uses: actions/upload-artifact@v4
        with:
          name: LectorLibros-Android-APK
          path: apk_output/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar Release en GitHub con APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: Lector Libros v1.0.0 (Instalador Android)
          body: |
            ### 📱 Lector Libros v1.0.0 para Android
            ¡Tu aplicación ya está lista para instalar!
            
            Descarga directamente el archivo **`LectorLibros.apk`** que aparece abajo en los archivos adjuntos (Assets) e instálalo en tu celular Android.
          files: apk_output/*.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Generar APK de Android (Lector Libros)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Configurar Java 21 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes de Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" \
            "platforms;android-35" \
            "build-tools;36.0.0" \
            "build-tools;35.0.0" || true

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar aplicacion web
        run: npm run build

      - name: Sincronizar Capacitor con Android
        run: npx cap sync android

      - name: Garantizar cordova.variables.gradle
        run: |
          # Si cap sync no genero el archivo, crearlo como fallback
          if [ ! -f android/capacitor-cordova-android-plugins/cordova.variables.gradle ]; then
            mkdir -p android/capacitor-cordova-android-plugins
            cat > android/capacitor-cordova-android-plugins/cordova.variables.gradle << 'GRADLE'
          ext {
            cdvMinSdkVersion = project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
            cdvPluginPostBuildExtras = []
            cordovaConfig = [:]
          }
          GRADLE
            echo "WARN: cordova.variables.gradle fue creado como fallback"
          fi

      - name: Permisos ejecutables para Gradle
        run: chmod +x ./android/gradlew

      - name: Compilar APK Debug con Gradle
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Recolectar archivos APK generados
        run: |
          mkdir -p apk_output
          find android/ -name "*.apk" -type f -exec cp {} apk_output/ \;
          if [ -f apk_output/app-debug.apk ]; then
            cp apk_output/app-debug.apk apk_output/LectorLibros.apk
          fi
          echo "Archivos APK listos:"
          ls -lh apk_output/

      - name: Subir APK como artefacto de descarga
        uses: actions/upload-artifact@v4
        with:
          name: LectorLibros-Android-APK
          path: apk_output/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar Release en GitHub con APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Lector Libros v1.0.${{ github.run_number }}
          body: |
            ### 📱 Lector Libros para Android
            ¡Tu aplicación ya está lista para instalar!
            
            Descarga directamente el archivo **`LectorLibros.apk`** que aparece abajo en los archivos adjuntos (Assets) e instálalo en tu celular Android.
          files: apk_output/*.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Generar APK de Android (Lector Libros)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configurar Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Permisos ejecutables para Gradle
        run: chmod +x ./android/gradlew

      - name: Instalar dependencias
        run: npm install

      - name: Compilar aplicacion web
        run: npm run build

      - name: Copiar archivos web a Android
        run: |
          mkdir -p android/app/src/main/assets/public
          npx cap copy android || {
            echo "Fallback de copia directa..."
            cp -r dist/* android/app/src/main/assets/public/
            cp capacitor.config.json android/app/src/main/assets/capacitor.config.json
            echo "[]" > android/app/src/main/assets/capacitor.plugins.json
          }

      - name: Compilar APK Debug con Gradle
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Subir APK como artefacto de descarga
        uses: actions/upload-artifact@v4
        with:
          name: LectorLibros-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

name: Generar APK de Android (Lector Libros)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configurar Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes de Android SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Permisos ejecutables para Gradle
        run: chmod +x ./android/gradlew

      - name: Instalar dependencias
        run: npm install

      - name: Compilar aplicacion web
        run: npm run build

      - name: Copiar archivos web a Android
        run: |
          mkdir -p android/app/src/main/assets/public
          npx cap copy android || {
            echo "Fallback de copia directa..."
            cp -r dist/* android/app/src/main/assets/public/
            cp capacitor.config.json android/app/src/main/assets/capacitor.config.json
            echo "[]" > android/app/src/main/assets/capacitor.plugins.json
          }

      - name: Compilar APK Debug con Gradle
        working-directory: ./android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle_build.log

      - name: Mostrar registro en caso de fallo
        if: failure()
        run: |
          echo "==================== ULTIMAS LINEAS DE GRADLE ===================="
          tail -n 80 gradle_build.log || true
          echo "================================================================="

      - name: Recolectar archivos APK generados
        run: |
          mkdir -p apk_output
          find . -name "*.apk" -type f -exec cp {} apk_output/ \;
          echo "Archivos APK encontrados:"
          ls -lh apk_output/

      - name: Subir APK como artefacto de descarga
        uses: actions/upload-artifact@v4
        with:
          name: LectorLibros-Android-APK
          path: apk_output/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar Release en GitHub con APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: Lector Libros v1.0.0 (Instalador Android)
          body: |
            ### 📱 Lector Libros v1.0.0 para Android
            ¡Tu aplicación ya está lista!
            
            Descarga directamente el archivo **`.apk`** que aparece abajo en los archivos adjuntos (Assets) e instálalo en tu celular Android.
          files: apk_output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
